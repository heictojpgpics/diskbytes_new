name: CI

# DiskBytes CI (doc 09 §2 static gate battery + Windows-only verification).
# The dev sandbox is Linux; this workflow runs the REAL Windows gates on
# windows-latest: MSVC toolchain, WebView2, and the NSIS bundle build.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Static gates + core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: "Gate: cargo fmt --check"
        run: cargo fmt --all -- --check
        working-directory: src-tauri
        shell: bash

      - name: "Gate: clippy -D warnings (workspace)"
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri
        shell: bash

      - name: "Gate: core tests"
        run: cargo test --workspace
        working-directory: src-tauri
        shell: bash

      # Diagnostic (session-4): the debug lib-test exe intermittently fails
      # to LOAD (STATUS_ENTRYPOINT_NOT_FOUND) while the release app runs.
      # When that happens, dump the exe's import table so the missing
      # entry point is identifiable from the logs instead of guesswork.
      - name: "Diag: dump test-exe imports (on test failure)"
        if: failure()
        working-directory: src-tauri
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse target\debug\deps -Filter "diskbytes_lib-*.exe" | Select-Object -First 1
          if (-not $exe) { "no test exe found"; exit 0 }
          "exe: $($exe.FullName)"
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { "dumpbin not found"; exit 0 }
          "--- dependents ---"
          & $dumpbin /dependents $exe.FullName | Select-Object -First 60
          "--- imports (dll: entry summary) ---"
          $out = & $dumpbin /imports $exe.FullName
          $out | Select-Object -First 400
          "--- PATH dll shadowing check ---"
          $deps = & $dumpbin /dependents $exe.FullName | Where-Object { $_ -match '\.dll$' } | ForEach-Object { $_.Trim() }
          foreach ($d in $deps) {
            $hits = Get-Command $d -ErrorAction SilentlyContinue
            if ($hits) { "  $d -> $($hits.Source)" }
          }

      - name: "Gate: 1M-node bench (M2: < 2 s)"
        run: cargo test --release -p diskbytes-core -- --ignored bench_1m --nocapture
        working-directory: src-tauri
        shell: bash

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: "Gate: typecheck"
        run: npm run typecheck

      - name: "Gate: vitest"
        run: npx vitest run --passWithNoTests

      - name: "Gate: R7.1 — zero direct-delete APIs in src-tauri/src"
        shell: bash
        run: |
          if git grep -nE "remove_file|remove_dir|remove_dir_all|DeleteFileW|RemoveDirectoryW|SHEmptyRecycleBin" src-tauri/src; then
            echo "::error::Direct-delete API found (R7.1 violation — cleanup must go through the Recycle Bin)";
            exit 1
          fi

      - name: "Gate: R2.2 — no TODO/FIXME/stubs"
        shell: bash
        run: |
          if git grep -nE "TODO|FIXME|unimplemented!|todo!" src src-tauri/src; then
            echo "::error::Stub marker found (R2.2 violation — code ships complete or not at all)";
            exit 1
          fi

      - name: "Gate: frontend build"
        run: npm run build

  bundle:
    name: Windows NSIS bundle (real build)
    runs-on: windows-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: "M11: brand icon (source -> all sizes)"
        shell: pwsh
        run: scripts/make_icon.ps1

      - name: Build the NSIS installer (release)
        run: npx tauri build --target x86_64-pc-windows-msvc
        timeout-minutes: 30

      - name: "M11: portable zip + SHA256SUMS.txt"
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName "$out/DiskBytes-$version-x64-setup.exe"
          $portable = "$out/portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/diskbytes.exe "$portable/DiskBytes.exe"
          @("DiskBytes portable. Runs without installing; WebView2 required.", "See docs/DISTRIBUTION.md for SmartScreen/Unblock guidance.") | Set-Content "$portable/README.txt"
          Compress-Archive -Path $portable -DestinationPath "$out/DiskBytes-$version-x64-portable.zip" -Force
          Remove-Item $portable -Recurse -Force
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: diskbytes-windows-release
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            dist-release/*
          if-no-files-found: error
